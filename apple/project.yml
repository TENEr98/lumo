# Источник истины для Lumo.xcodeproj. После правки: `cd apple && xcodegen`.
name: Lumo
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Lumo
    # Ядро для симулятора собирается только под arm64 (scripts/build-xcframework.sh),
    # поэтому срез x86_64 симулятора исключён: иначе линковка Lumo-iOS падает.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  LumoKit:
    path: Packages/LumoKit
targets:
  Lumo-macOS:
    type: application
    platform: macOS
    sources: [Lumo-macOS]
    dependencies:
      - package: LumoKit
    settings:
      base:
        PRODUCT_NAME: Lumo
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mac
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
  Lumo-iOS:
    type: application
    platform: iOS
    sources: [Lumo-iOS]
    dependencies:
      - package: LumoKit
    settings:
      base:
        PRODUCT_NAME: Lumo
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  Lumo-macOS:
    build:
      targets: { Lumo-macOS: all }
  Lumo-iOS:
    build:
      targets: { Lumo-iOS: all }
